# Automatic Claude review on every new or updated pull request.
# Claude only comments (hints, no code changes), matching the learning-project rules in CLAUDE.md.
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# a new push cancels the still-running review of the previous commit
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # skip draft PRs; review starts once the PR is marked ready
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out.
            This is a student learning project (FHDW web development): the author writes the code
            themselves. Follow the rules in CLAUDE.md.

            Focus on:
            - Bugs and logic errors
            - Security (input validation, auth, DB access, error output; use OWASP Cheat Sheets as reference)
            - Current standards of the stack (TypeScript strict, React hooks, Express 5, Drizzle ORM)
            - Consistency with existing project patterns (request() in frontend/src/api/client.ts,
              design tokens in frontend/src/styles/tokens.css, backend error format { message })

            Rules for your feedback:
            - Write everything in English.
            - Give hints and explain WHY something is a problem; point to docs where useful.
              Do not post complete solutions or large code blocks. A short one-line hint is fine.
            - Weigh suggestions for a small local learning app; mark optional/nice-to-have points as such.
            - If something is done well, you may say so briefly.
            - Do not modify files, commit or push.

            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for
            comments on specific lines. Use `gh pr comment` for one short overall summary.
            Only post GitHub comments; do not return review text as a message.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit"
