# Startet eine PostgreSQL-Datenbank für die lokale Entwicklung.
# Die Zugangsdaten kommen aus der Datei .env in diesem Ordner.
name: flashcards

services:
  db:
    image: postgres:18-alpine
    container_name: flashcards-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # links: Port auf deinem Mac, rechts: Port im Container
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Die Daten bleiben erhalten, auch wenn der Container gelöscht wird
      - db-data:/var/lib/postgresql
    healthcheck:
      # Prüft regelmäßig, ob die Datenbank Verbindungen annimmt
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
